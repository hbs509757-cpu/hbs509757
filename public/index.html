<style>
:root {
  --bg: #FFFAF2; --card: #FFFFFF; --ink: #2B3438; --muted: #5F6669; --line: #F3E2D2;
  --accent: #EF7D3A; --accent-ink: #9A3412; --soft: #FFF1E3; --tag: #FFD9B8;
  --ok-bg: #D6F2EA; --ok: #0F5E4E; --bad-bg: #FDECEA; --bad: #B42318; --blue-bg: #E8F3FB; --blue: #0B5A86; --yellow: #F5C658;
  --body: 'Noto Sans TC', system-ui, -apple-system, sans-serif; --num: 'Space Grotesk', 'Noto Sans TC', sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    // 主管
    laHide: function (v) { var h = S.f.laHide || {}; h[v] = !h[v]; S.f.laHide = h; render(); },
    hireSave: function (v) { var d = val('hrDate'); DB.hire[v] = d; DB.usedBefore[v] = +val('hrBefore') || 0; S.f.hireEd = null; save(); toast('已儲存'); render(); },
    ipAdd: function () { var ip = val('ipNew').trim(); if (!/^(\d{1,3}\.){3}\d{1,3}$|^[0-9a-fA-F:]{3,}$/.test(ip)) return toast('IP 格式不對'); if (DB.cfg.ips.indexOf(ip) < 0) DB.cfg.ips.push(ip); save(); checkIp(); render(); },
    ipAddCur: function () { if (S.ip && DB.cfg.ips.indexOf(S.ip) < 0) DB.cfg.ips.push(S.ip); save(); checkIp(); render(); },
    ipDel: function (v) { if (DB.cfg.ips.length <= 1) return toast('至少要保留一個 IP'); DB.cfg.ips = DB.cfg.ips.filter(function (x) { return x !== v; }); save(); checkIp(); render(); },
    rulesSave: function () { var t = val('rulesTxt').split('\n').map(function (x) { return x.trim(); }).filter(Boolean); DB.cfg.rules = t.length ? t : RULES0.slice(); save(); toast('已儲存'); render(); },
    pwSave: function () { var a = acc(S.me); var old = val('pwOld'), n1 = val('pwNew'), n2 = val('pwNew2'); if (old !== (DB.pw[a.email] || a.pw || '12345')) return toast('目前密碼不正確'); if (n1.length < 8 || !/[A-Za-z]/.test(n1) || !/\d/.test(n1)) return toast('新密碼至少 8 碼，要有英文和數字'); if (n1 !== n2) return toast('兩次輸入的新密碼不一樣'); DB.pw[a.email] = n1; save(); toast('密碼已更新，下次登入請用新密碼'); S.view = null; render(); },
    backupJson: function () { DB.lastBackup = Date.now(); save(); var data = JSON.parse(JSON.stringify(DB)); data.__backup = { app: '惠邦內部平台', by: S.me, at: new Date().toISOString(), version: 2 }; dl('HuiBang_backup_' + dkey() + '.json', JSON.stringify(data), 'application/json'); DB.lastBackup = Date.now(); save(); toast('備份檔已下載，請上傳到公司雲端資料夾'); render(); },
    backupCsv: function () { var rows = [['類型', '姓名', '日期', '上班', '下班', '假別', '時段', '狀態']]; Object.keys(DB.punch).forEach(function (n) { Object.keys(DB.punch[n]).sort().forEach(function (k) { var p = DB.punch[n][k]; rows.push(['打卡', n, k, p.in || '', p.out || '', '', '', (mins(p.in) > WORK_IN ? '遲到' : '') + (p.out && mins(p.out) < WORK_OUT ? '早退' : '')]); }); });
      DB.approvals.filter(function (a) { return a.type === '休假申請'; }).forEach(function (a) { rows.push(['休假', a.from, a.leaveDate, '', '', a.kind, a.span, { pending: '待簽核', approved: '已核准', rejected: '已退回' }[a.status]]); });
      dl('HuiBang_punch_leave_' + dkey() + '.csv', '﻿' + rows.map(function (r) { return r.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n'), 'text/csv'); toast('已下載 Excel 檔'); },
    restoreGo: function () { var d = S.f.restore && S.f.restore.data; if (!d || !d.rooms || !d.punch) return toast('這不是惠邦的備份檔'); delete d.__backup; Object.keys(DB).forEach(function (k) { delete DB[k]; }); Object.assign(DB, d); S.f.restore = null; save(); toast('已還原資料'); render(); },
    zoom: function (v) { var w = window.open(); if (w) w.document.write('<img src="' + v + '" style="max-width:100%">'); }
  };
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    if (el.tagName === 'A') return;
    var act = el.getAttribute('data-act'); if (!act || !A[act]) return;
    e.preventDefault(); keep(); A[act](el.getAttribute('data-v') || '', el);
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.getAttribute('data-log')) { var l = DB.logs.filter(function (x) { return x.id === t.getAttribute('data-log'); })[0]; if (l) { l[t.getAttribute('data-field')] = t.value; l.ts = Date.now(); clearTimeout(saveT); saveT = setTimeout(save, 400); } return; }
    if (t.getAttribute('data-mnote')) { var mt = curMtg(); mdb().notes[mt.id] = mdb().notes[mt.id] || {}; mdb().notes[mt.id][t.getAttribute('data-mnote')] = t.value; clearTimeout(saveT); saveT = setTimeout(save, 400); return; }
    if (t.getAttribute('data-mpf') === 'plan') { mProj(t.getAttribute('data-mp')).plan = t.value; clearTimeout(saveT); saveT = setTimeout(save, 400); return; }
    if (t.id === 'roomQ') { S.f.roomQ = t.value; var pos = t.selectionStart; render(); var q = document.getElementById('roomQ'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
    if (t.id === 'draft') { S.f['draft_' + S.roomId] = t.value; var typing = /(^|\s)@[^\s@]*$/.test(t.value); if (typing !== !!S.f.atOpen) { S.f.atOpen = typing; var p = t.selectionStart; render(); var d = document.getElementById('draft'); if (d) { d.focus(); d.setSelectionRange(p, p); } } }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.getAttribute('data-log')) { var l = DB.logs.filter(function (x) { return x.id === t.getAttribute('data-log'); })[0]; if (l) { l[t.getAttribute('data-field')] = t.value; save(); } return; }
    if (t.getAttribute('data-mp') && t.getAttribute('data-mpf') !== 'plan') { var pid = t.getAttribute('data-mp'), fld = t.getAttribute('data-mpf'); if (fld === 'status' && t.value === '__del') { S.f.pdDel = pid; return render(); } mProj(pid)[fld] = t.value; save(); if (fld === 'status') toast(mProj(pid).name + ' 改為「' + t.value + '」'); render(); return; }
    if (t.getAttribute('data-mtodo')) { var x = mdb().todos.filter(function (y) { return y.id === t.getAttribute('data-mtodo'); })[0]; if (x) { x.done = t.checked; x.doneIn = t.checked ? curMtg().id : ''; save(); render(); } return; }
    if (t.getAttribute('data-mtgf')) { curMtg()[t.getAttribute('data-mtgf')] = t.value; save(); render(); return; }
    if (t.id === 'mtgSel') { S.f.mtgId = t.value; render(); return; }
    if (t.getAttribute('data-dwassign')) { var d = dw(t.getAttribute('data-dwassign')); if (t.value) { d.status = 1; d.maker = t.value; notify(roomFor(d.room || d.project), '製圖指派給 ' + t.value + '：' + d.project + '「' + d.desc.slice(0, 18) + '」', t.value); save(); render(); } return; }
    if (t.id === 'apType') { keep(); render(); }
    if (t.id === 'ceCat') { keep(); render(); }
    if (t.id === 'progDate') { S.f.progDay = t.value || dkey(); render(); }
    if (t.id === 'drawDayPicker') { S.f.drawDay = t.value || ''; render(); return; }
    if (t.id === 'wxSel') { DB.cfg.weather = t.value; save(); toast('已更新天氣警報'); }
    if (t.id === 'apImgs') { keep(); readImages(t.files, 1200, function (srcs) { S.f.ap.images = (S.f.ap.images || []).concat(srcs); render(); }); }
    if (t.id === 'restoreFile' && t.files && t.files[0]) { var fl = t.files[0]; var fr = new FileReader(); fr.onload = function () { try { var d = JSON.parse(fr.result); if (!d.rooms || !d.punch) throw 0; S.f.restore = { name: fl.name, data: d }; } catch (x) { toast('這不是惠邦的備份檔'); } render(); }; fr.readAsText(fl); }
    if (t.id === 'chatImg') { var r = room(); readImages(t.files, 1024, function (srcs) { srcs.forEach(function (src) { r.msgs.push({ id: uid(), who: S.me, img: src, t: Date.now(), mentions: [] }); }); save(); render(); }); }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.target.id === 'lgPw' || e.target.id === 'lgEmail') && e.key === 'Enter') { keep(); A.login(); }
  });
  function readImages(files, max, cb) {
    var arr = Array.prototype.slice.call(files || []).filter(function (f) { return /^image\//.test(f.type); }); var out = []; var n = arr.length; if (!n) return;
    arr.forEach(function (f) { var fr = new FileReader(); fr.onload = function () { var img = new Image(); img.onload = function () { var k = Math.min(1, max / Math.max(img.width, img.height)); var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); out.push(c.toDataURL('image/jpeg', 0.72)); if (--n === 0) cb(out); }; img.onerror = function () { if (--n === 0) cb(out); }; img.src = fr.result; }; fr.readAsDataURL(f); });
  }
  setInterval(function () { if (S.me && !document.querySelector('input:focus, textarea:focus, select:focus') && S.view !== 'room') render(); }, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.me) checkIp(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(function () {}); }
  render();
  if (S.me) checkIp();
  window.__HB = { DB: DB, S: S, render: render };
})();
